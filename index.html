<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Railway Boom · Solo Automa</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#282923;background:#f3f0e7}*{box-sizing:border-box}body{margin:0}.wrap{max-width:680px;margin:auto;padding:18px 16px 80px}header{background:#263d49;color:#fff;padding:20px;border-radius:0 0 20px 20px}h1{font-size:24px;margin:0}h2{font-size:19px;margin:0 0 10px}small,.muted{color:#72766f}header small{color:#cad7db}.panel{background:#fff;border:1px solid #deded6;border-radius:16px;padding:17px;margin-top:14px;box-shadow:0 2px 8px #00000008}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}button{border:0;border-radius:11px;background:#d9e3df;color:#263d49;padding:13px 14px;font-size:15px;font-weight:700;cursor:pointer}button.primary{background:#286b68;color:white}button.secondary{background:#ece8df}button.warn{background:#f5e4de;color:#8a3d2d}button:disabled{opacity:.4}input,select{font-size:18px;width:100%;border:1px solid #c8c9c0;border-radius:10px;padding:11px;background:#fff;color:#252525}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.stat{background:#f1f5f3;padding:12px;border-radius:12px;text-align:center}.stat strong{display:block;font-size:30px}.pill{display:inline-block;background:#dce9e4;color:#255e55;border-radius:30px;padding:5px 9px;font-size:12px;font-weight:700}.card{background:#b2a18a;border:5px solid #e8e4cf;border-radius:15px;padding:10px;color:#111}.card table{width:100%;border-spacing:3px}.card td{background:#e2d5c4;padding:5px 7px;font-weight:800}.card .big{font-size:21px}.symbol{display:grid;grid-template-columns:repeat(2,30px);gap:4px}.symbol span{height:24px;background:#3d3d3d;border-radius:3px;color:#fff;text-align:center;font-size:21px;line-height:23px}.hint{font-size:13px;line-height:1.5;background:#f8f5ed;border-left:3px solid #c29c5d;padding:10px;margin-top:12px}.log{max-height:170px;overflow:auto;font-size:13px;line-height:1.5}.log p{border-bottom:1px solid #eee;padding:5px 0;margin:0}.hidden{display:none}.phase{font-size:13px;color:#576b68;font-weight:800;letter-spacing:.03em}.actions{display:grid;gap:8px;margin-top:12px}footer{font-size:12px;color:#777;margin-top:20px;line-height:1.5}</style><style id="compact-v2">
:root{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#26343c;background:#ecebe5}body{background:#ecebe5}header{border-radius:0;background:#273c55;padding:15px 18px;border-bottom:4px solid #c9a978}header h1{font-size:19px;letter-spacing:.15em;font-weight:800}header small{font-size:9px;letter-spacing:.19em;color:#cdd7df}.wrap{max-width:540px;padding:10px 12px 35px}.panel{padding:13px;margin-top:9px;border:1px solid #d9d6cb;border-radius:11px;box-shadow:none;background:#fcfbf7}.panel:first-child{margin-top:0}.pill{background:#e9e3d7;color:#594f44;border-radius:5px;padding:4px 7px;font-size:11px}.phase{margin:7px 0 0;font-size:11px;letter-spacing:.07em;color:#667178}.grid{gap:7px}.stat{background:#f1eee6;border-radius:7px;padding:7px}.stat strong{font-size:26px}.stat small{font-size:11px}button{border-radius:7px;padding:11px;font-size:13px}button.primary{background:#294e62;color:#fff}button.secondary{background:#eae5d9;color:#3e4d52}button.warn{background:#eee4de;color:#884b40}input,select{font-size:16px;padding:9px;border-radius:6px;background:#fffdf8}label{font-size:11px;margin:7px 0 5px;color:#5e686a}.actions{gap:7px;margin-top:9px}.row{gap:7px}h2{font-size:14px;margin:0 0 5px}#message{font-size:12px!important;line-height:1.35!important;margin:9px 0!important;color:#55626b}#message:empty{display:none}.hint{font-size:12px;padding:10px;border-left:2px solid #b98c53;background:#f4f0e8;line-height:1.45}.card{border:3px solid #ece6d6;padding:9px;border-radius:9px;background:#b8a994}.symbol{grid-template-columns:repeat(2,25px);gap:3px}.symbol span{height:21px;font-size:18px;line-height:20px}.log{max-height:95px;font-size:11px}.log p{padding:3px 0}.panel:last-of-type .actions{grid-template-columns:1fr 1fr}.muted{font-size:12px}#deck{font-size:11px}#auction .actions{grid-template-columns:1fr}#playControls{grid-template-columns:1fr 1fr!important}#playControls label,#playControls input,#playControls small{grid-column:1/-1}#playControls button{min-width:0}#resolution .actions{grid-template-columns:1fr}#flags{color:#8c6751}
<style>.bidhead{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800;letter-spacing:.06em;color:#5d686c}.bid-choices{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}.bid-choices button{padding:12px 0;font-size:17px;min-height:44px;background:#eae5d9;color:#294052;border:1px solid #d5cbb9}.bid-choices button:disabled{opacity:.25}.bid-choices button.pass-bid{background:#294e62;color:white;font-size:12px}.bid-choices button.more-bid{font-size:12px}.bid-choices button:active{transform:scale(.96)}#playControls{display:grid!important;grid-template-columns:1fr!important}#playControls.hidden{display:none!important}@media(max-width:380px){.bid-choices{gap:4px}.bid-choices button{font-size:15px}} #startControls.hidden{display:none!important} #start:disabled{opacity:.4;pointer-events:none}</style></head><body><header><div style="max-width:680px;margin:auto"><small>SOLO AUTOMA</small><h1>RAILWAY BOOM</h1></div></header><main class="wrap"><div class="panel"><div class="row"><div><span class="pill" id="round">Ronda 1 / 4</span><p class="phase" id="phase">TRENES · SUBASTA DE MATERIALES</p></div><div style="text-align:right"><small>PV AUTÓMATA</small><div style="font-size:30px;font-weight:800" id="score">0</div></div></div><div class="grid"><div class="stat"><small>Tu puja</small><strong id="human">0</strong></div><div class="stat"><small>Puja autómata</small><strong id="bot">0</strong></div></div><p id="message" style="font-weight:600;line-height:1.5"></p><div id="auction"><label for="limit">Tus recursos</label><input type="number" id="limit" min="0" value="8"><div class="actions" id="startControls"><button class="primary" id="start">Iniciar puja</button></div><div class="actions hidden" id="playControls"><div class="bidhead"><span>ELIGE TU PUJA</span><small id="flags"></small></div><div id="bidChoices" class="bid-choices"></div></div></div><div id="resolution" class="hidden"><div id="actionResult" class="hint"></div><div class="actions"><button class="primary" id="next">Siguiente fase</button></div></div></div><div class="panel"><div class="row"><h2>Carta</h2><small id="deck">8 cartas disponibles</small></div><div id="card" class="muted">Sin carta</div></div><div class="panel"><h2>Historial</h2><div class="log" id="log"></div><div class="actions"><button class="secondary" id="undo">↶ Deshacer</button><button class="warn" id="reset">Reiniciar</button></div></div></main><script>
const cards=[{b:[[3,3],[3,3],[4,2],[4,3]],f:1,d:'↓',t:3,x:['01','01','01']},{b:[[3,1],[3,1],[3,3],[3,3]],f:1,d:'↓',t:5,x:['10','11','00']},{b:[[2,2],[2,2],[3,1],[3,1]],f:1,d:'↓',t:4,x:['10','10','10']},{b:[[2,1],[2,1],[2,3],[2,3]],f:0,d:'↑',t:5,x:['01','00','11']},{b:[[3,2],[3,2],[4,1],[4,2]],f:1,d:'↑',t:4,x:['10','10','10']},{b:[[2,2],[2,3],[3,2],[3,2]],f:1,d:'↑',t:3,x:['01','10','01']},{b:[[1,1],[1,1],[2,1],[2,1]],f:0,d:'↑',t:4,x:['01','01','01']},{b:[[1,1],[1,2],[2,2],[2,2]],f:0,d:'↓',t:3,x:['10','01','10']}];
const phases=[['Trenes','Materiales'],['Expansión','Dinero'],['Desarrollo','Tecnología'],['Ingresos',''],['Explotación',''],['Objetivos','Recurso del objetivo']];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fresh=()=>({round:0,phase:0,score:0,human:0,bot:0,limit:8,flags:0,draws:0,deck:shuffle([0,1,2,3,4,5,6,7]),last:null,status:'ready',winner:null,logs:[],actionCard:null});let s;try{s=JSON.parse(localStorage.getItem('rb_solo_v2'))||fresh()}catch{s=fresh()}let history=[];const $=id=>document.getElementById(id);const save=()=>{try{localStorage.setItem('rb_solo_v2',JSON.stringify(s))}catch{}};const checkpoint=()=>history.push(JSON.stringify(s));const log=t=>s.logs.unshift(t);function draw(){if(!s.deck.length)s.deck=shuffle([0,1,2,3,4,5,6,7]);let id=s.deck.pop();s.last=id;return cards[id]}
function finish(winner,why){s.winner=winner;s.status='resolved';if(s.bot>0){s.score+=s.bot;log(`R${s.round+1} ${phases[s.phase][0]}: autómata +${s.bot} PV por su última puja.`)}log(why);if(winner==='bot'&&[0,1,2].includes(s.phase)){s.actionCard=draw();log('Carta adicional para determinar la acción del autómata.')}render()}
function botTurn(){let c=draw();s.draws++;if(c.f)s.flags++;let threshold=s.round<2?2:3;if(s.flags>=threshold)return finish('human','El autómata se retira por acumular '+threshold+' banderas.');let target;if(s.draws===1){target=c.b[s.round][0];if(target===s.human)target++}else{target=s.bot+c.b[s.round][1];if(target===s.human)target++}if(target<=s.human)return finish('human','El autómata se retira: no supera tu puja.');if(target>s.limit)return finish('human','El autómata se retira: superaría tu límite de recursos ('+s.limit+').');s.bot=target;log('Autómata puja '+target+'.');s.status='playing';render()}
function actionText(){if(s.winner!=='bot')return 'Has ganado la subasta. Realiza tu turno según el reglamento oficial.';if(s.phase===0)return 'El autómata elige los componentes marcados con X en la matriz de la carta adicional. Las 3 filas corresponden a las posiciones de las cartas de locomotora/vagones en la oferta. Retira físicamente los componentes seleccionados. Comprueba la correspondencia de posiciones con la disposición de tu mesa.';if(s.phase===1)return `El autómata elige la estación disponible ${s.actionCard.d==='↑'?'superior':'inferior'} y coloca ${s.actionCard.t} fichas de vía en dirección a la otra estación ofertada. Haz el trazado físicamente siguiendo el artículo original.`;if(s.phase===2)return `El autómata adquiere la fila ${s.actionCard.d==='↑'?'superior':'inferior'} de cartas de desarrollo disponibles. Retira esas cartas de la oferta.`;if(s.phase===5)return 'El autómata coloca un cubo en el espacio libre de mayor multiplicador de PV del objetivo. En la preparación a 2 jugadores, los dos espacios superiores están bloqueados.';return ''}
function render(){let p=phases[s.phase];$('round').textContent='Ronda '+(s.round+1)+' / 4';$('phase').textContent=p[0].toUpperCase()+(p[1]?' · '+p[1].toUpperCase():'');$('score').textContent=s.score;$('human').textContent=s.human;$('bot').textContent=s.bot;$('limit').value=s.limit;$('limit').disabled=s.status!=='ready';$('auction').classList.toggle('hidden',s.status==='resolved'||s.status==='done');$('resolution').classList.toggle('hidden',s.status!=='resolved'&&s.status!=='done');$('startControls').classList.toggle('hidden',s.status!=='ready');$('start').disabled=s.status!=='ready';$('playControls').classList.toggle('hidden',s.status!=='playing');$('flags').textContent='Banderas: '+s.flags+' / '+(s.round<2?2:3);$('deck').textContent=s.deck.length+' cartas restantes';$('log').innerHTML=s.logs.map(t=>'<p>'+t.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</p>').join('')||'<small>Aún no hay movimientos.</small>';
let c=s.last===null?null:cards[s.last];$('card').innerHTML=c?`<div class="card"><div class="row"><strong>Carta ${s.last+1} ${c.f?'🚩':''}</strong><strong>R${s.round+1}: ${c.b[s.round][0]} +${c.b[s.round][1]}</strong></div><div class="row" style="margin-top:10px"><div class="symbol">${c.x.join('').split('').map(x=>`<span>${x==='1'?'×':''}</span>`).join('')}</div><strong style="font-size:30px">${c.d}</strong><strong style="font-size:24px">🚂 ${c.t}</strong></div></div>`:'Sin carta';
if(s.status==='ready'){$('message').textContent=p[1]?'Introduce tus recursos disponibles para la subasta de '+p[1].toLowerCase()+'.':'Esta fase no tiene subasta.';$('start').textContent=p[1]?'Iniciar puja':'Resolver fase';}
if(s.status==='playing'){$('message').textContent=s.bot>s.human?'El autómata va ganando. Supera su puja o retírate.':'Introduce tu puja; el autómata responderá.';renderBidChoices();}
if(s.status==='resolved'){$('message').textContent=s.winner==='bot'?'Subasta ganada por el autómata.':'Subasta ganada por ti.';$('actionResult').textContent=actionText();}
if(s.status==='done'){$('actionResult').textContent='Partida finalizada. PV del autómata antes de objetivos: '+s.score+'. Añade manualmente la puntuación de los objetivos cumplidos según las cartas, vías y trenes del autómata. Para recursos e ingresos usa los valores de tu tablero, según la variante original.';$('next').disabled=true;}else $('next').disabled=false;save()}
$('start').onclick=()=>{if(s.status!=='ready')return;checkpoint();s.limit=Math.max(0,Number($('limit').value)||0);s.human=0;s.bot=0;s.flags=0;s.draws=0;s.actionCard=null;s.winner=null;if(s.phase===3||s.phase===4){s.status='resolved';s.winner='none';log(pname()+' — el autómata no actúa.');render();return}if(s.phase===5){s.status='resolved';s.winner='bot';log('Objetivos: el autómata coloca un cubo en el mayor multiplicador libre.');render();return}s.status='playing';log('R'+(s.round+1)+' · '+pname()+' — empieza subasta.');botTurn()};function pname(){return phases[s.phase][0]}
function makeBid(n){if(s.status!=='playing')return;if(n===0){checkpoint();finish('bot','Te retiras: gana la subasta el autómata.');return}if(!Number.isInteger(n)||n<=Math.max(s.human,s.bot)||n>s.limit){return}checkpoint();s.human=n;log('Tu puja: '+n+'.');botTurn()}
function renderBidChoices(){const root=$('bidChoices');root.replaceChildren();let min=Math.max(s.human,s.bot)+1;let top=Math.max(10,Math.min(s.limit,20));let vals=[0,...Array.from({length:top},(_,i)=>i+1)];if(min>10&&min<=s.limit&&!vals.includes(min))vals.push(min);for(const n of vals){const b=document.createElement('button');b.type='button';b.textContent=n===0?'0 · PASO':String(n);if(n===0)b.className='pass-bid';b.disabled=n!==0&&(n<min||n>s.limit);b.addEventListener('click',()=>makeBid(n));root.appendChild(b)}if(s.limit>top){const b=document.createElement('button');b.type='button';b.className='more-bid';b.textContent='Más…';b.onclick=()=>{const n=Number(prompt('Tu puja (máximo '+s.limit+')',Math.max(min,top+1)));makeBid(n)};root.appendChild(b)}}
$('next').onclick=()=>{if(s.status!=='resolved')return;checkpoint();s.phase++;if(s.phase===6){s.phase=0;s.round++}if(s.round===4){s.status='done';log('Fin de la ronda 4. Calcular objetivos.');render();return}s.status='ready';s.human=0;s.bot=0;s.flags=0;s.draws=0;s.winner=null;s.actionCard=null;s.last=null;render()};$('undo').onclick=()=>{if(!history.length){alert('Solo puedes deshacer pasos realizados desde que abriste esta página.');return}s=JSON.parse(history.pop());render()};$('reset').onclick=()=>{if(confirm('¿Iniciar una nueva partida? Se perderá el progreso guardado.')){checkpoint();s=fresh();render()}};render();
</script></body></html>
